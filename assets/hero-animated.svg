<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="460">
      <stop stop-color="#05080A"/>
      <stop offset="0.52" stop-color="#0B171A"/>
      <stop offset="1" stop-color="#05080A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DDFE4"/>
      <stop offset="1" stop-color="#E9FFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 190) rotate(90) scale(280 430)">
      <stop stop-color="#9DDFE4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9DDFE4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" stroke="#BED7DA" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="42" y="42" width="1316" height="376" rx="32"/></clipPath>
  </defs>
  <rect width="1400" height="460" fill="url(#bg)"/>
  <rect width="1400" height="460" fill="url(#grid)">
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect width="1400" height="460" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#clip)">
    <path d="M-90 315C140 160 270 380 470 255C640 148 755 122 935 225C1120 330 1240 180 1490 120" stroke="#9DDFE4" stroke-opacity="0.14" stroke-width="50">
      <animateTransform attributeName="transform" type="translate" values="-38 0;38 0;-38 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-90 318C140 163 270 383 470 258C640 151 755 125 935 228C1120 333 1240 183 1490 123" stroke="#E9FFFF" stroke-opacity="0.22" stroke-width="1.4">
      <animateTransform attributeName="transform" type="translate" values="34 0;-34 0;34 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <rect x="-320" y="0" width="210" height="460" fill="white" opacity="0.045" transform="skewX(-18)">
      <animate attributeName="x" values="-360;1520" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="42" y="42" width="1316" height="376" rx="32" stroke="#BED7DA" stroke-opacity="0.22"/>
  <g transform="translate(76 74)">
    <rect width="190" height="36" rx="18" fill="#9DDFE4" fill-opacity="0.08" stroke="#9DDFE4" stroke-opacity="0.26"/>
    <circle cx="23" cy="18" r="5" fill="#9EE6B6" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="23" fill="#BED7DA" fill-opacity="0.86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">PROFESSIONAL REVIEW</text>
  </g>
  <text x="82" y="178" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-3">Security Research Portfolio</text>
  <text x="84" y="236" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="650" letter-spacing="-1">Researching the unseen.
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3.2s" repeatCount="indefinite"/>
  </text>
  <text x="84" y="286" fill="#9AA8AC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Secure Systems  •  Security Research  •  Detection Engineering</text>
  <text x="84" y="328" fill="#6E7B80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Technical work. Minimal identity. Verifiable output.</text>
  <g transform="translate(960 86)">
    <rect width="330" height="250" rx="26" fill="#0B1115" fill-opacity="0.84" stroke="#BED7DA" stroke-opacity="0.17"/>
    <text x="26" y="42" fill="#BED7DA" fill-opacity="0.74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">REVIEW SIGNAL</text>
    <circle cx="258" cy="75" r="38" fill="none" stroke="#9DDFE4" stroke-opacity="0.16"/>
    <circle cx="258" cy="75" r="24" fill="none" stroke="#9DDFE4" stroke-opacity="0.26"/>
    <line x1="258" y1="75" x2="258" y2="37" stroke="#9DDFE4" stroke-opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 258 75" to="360 258 75" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="258" cy="75" r="4" fill="#9EE6B6" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <g>
      <rect x="26" y="120" width="278" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.035"/>
      <text x="42" y="142" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Technical Work</text>
      <text x="232" y="142" fill="#9DDFE4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Reviewable</text>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="26" y="166" width="278" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.035"/>
      <text x="42" y="188" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Public Identity</text>
      <text x="245" y="188" fill="#9DDFE4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Minimal</text>
      <animate attributeName="opacity" values="1;0.65;1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(26 222)">
      <rect width="278" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.06"/>
      <rect width="78" height="6" rx="3" fill="#9DDFE4">
        <animate attributeName="x" values="0;200;0" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
