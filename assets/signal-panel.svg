<svg width="1400" height="330" viewBox="0 0 1400 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="330">
      <stop stop-color="#0B1115"/>
      <stop offset="0.5" stop-color="#0B1A1E"/>
      <stop offset="1" stop-color="#06080A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DDFE4"/>
      <stop offset="1" stop-color="#E9FFFF"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#BED7DA" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1400" height="330" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="330" rx="30" fill="url(#grid)">
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="1398" height="328" rx="29" stroke="#BED7DA" stroke-opacity="0.16"/>
  <text x="56" y="76" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="-1.5">Private by design. Professional by output.</text>
  <text x="58" y="116" fill="#9AA8AC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Selected public material only. No private identity, client data, unpublished research, or internal direction is disclosed.</text>
  <g transform="translate(54 160)">
    <g>
      <rect width="295" height="104" rx="18" fill="#FFFFFF" fill-opacity="0.032" stroke="#BED7DA" stroke-opacity="0.14"/>
      <text x="22" y="38" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.6">01 / SCOPE</text>
      <text x="22" y="69" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Selected public work</text>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(328 0)">
      <rect width="295" height="104" rx="18" fill="#FFFFFF" fill-opacity="0.032" stroke="#BED7DA" stroke-opacity="0.14"/>
      <text x="22" y="38" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.6">02 / REVIEW</text>
      <text x="22" y="69" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Safe reproducible examples</text>
      <animate attributeName="opacity" values="1;0.7;1" dur="4.4s" begin="0.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(656 0)">
      <rect width="295" height="104" rx="18" fill="#FFFFFF" fill-opacity="0.032" stroke="#BED7DA" stroke-opacity="0.14"/>
      <text x="22" y="38" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.6">03 / PRIVACY</text>
      <text x="22" y="69" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Minimal public identity</text>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(984 0)">
      <rect width="295" height="104" rx="18" fill="#FFFFFF" fill-opacity="0.032" stroke="#BED7DA" stroke-opacity="0.14"/>
      <text x="22" y="38" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.6">04 / STANDARD</text>
      <text x="22" y="69" fill="#F3F7F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Professional review safe</text>
      <animate attributeName="opacity" values="1;0.7;1" dur="4.4s" begin="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
